name: Build and release macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Relay/package-lock.json
      - run: npm ci
        working-directory: Relay
      - run: npm test
        working-directory: Relay

  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned app
        run: xcodebuild -project MacApp/PrivateCat.xcodeproj -target PrivateCat -configuration Release -destination 'generic/platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/PrivateCat.app PrivateCat-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PrivateCat-macOS
          path: PrivateCat-macOS.zip
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" PrivateCat-macOS.zip --title "PrivateCat $GITHUB_REF_NAME" --generate-notes

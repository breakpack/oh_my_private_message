services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      npm:
        aliases:
          - privatecat-relay
  test-peer:
    build:
      context: .
      dockerfile: Dockerfile.test-peer
    restart: unless-stopped
    depends_on:
      - relay
    environment:
      PRIVATECAT_RELAY_URL: ws://privatecat-relay:8080/relay
      PRIVATECAT_TEST_PEER_DATA_DIR: /data
    volumes:
      - privatecat_test_peer_data:/data
    networks:
      - npm

networks:
  npm:
    external: true
    name: ${NPM_DOCKER_NETWORK:-npm_default}

volumes:
  privatecat_test_peer_data:

services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      npm:
        aliases:
          - privatecat-relay

networks:
  npm:
    external: true
    name: ${NPM_DOCKER_NETWORK:-npm_default}
